    <script>
      // Cleanly handle Vite HMR WebSocket connection rejections in preview / iframe environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('failed to connect to websocket') !== -1
        ) {
          event.preventDefault();
        }
      });
      var _origConsoleError = console.error;
      console.error = function() {
        var msg = Array.prototype.slice.call(arguments).map(String).join(' ');
        if (
          msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
          msg.indexOf('WebSocket closed without opened') !== -1
        ) {
          return;
        }
        _origConsoleError.apply(console, arguments);
      };
      var _origConsoleWarn = console.warn;
      console.warn = function() {
        var msg = Array.prototype.slice.call(arguments).map(String).join(' ');
        if (
          (msg.indexOf('[vite]') !== -1 && msg.indexOf('websocket') !== -1) ||
          msg.indexOf('Service worker registration failed') !== -1
        ) {
          return;
        }
        _origConsoleWarn.apply(console, arguments);
      };
    </script>
  </head>

  </body>
